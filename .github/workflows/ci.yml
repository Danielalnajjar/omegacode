# CI matrix: typecheck + full build (viewer + tsup + postbuild) + the test suite across
# OS × Node lines. Tests run AFTER the build so the post-build packaging suite (which skips
# itself when dist/ is absent) actually executes.
#
# Windows lanes are observational (continue-on-error) until the suite is proven there — the
# code has Windows paths but has never run on one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# cancel-in-progress everywhere (including main): newest commit wins. Without it a hung run
# blocks every subsequent main push in the queue — which is exactly what happened once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # Lanes finish in ~2 min; a hang must fail fast, not sit for the 6h default.
    timeout-minutes: 10
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22", "24"]
        experimental: [false]
        include:
          - os: windows-latest
            node: "22"
            experimental: true
          - os: windows-latest
            node: "24"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Full build: viewer workspace package, tsup, postbuild.
      - run: pnpm build
      - run: pnpm --filter viewer test
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
      - run: pnpm test
        env:
          OMEGACODE_REQUIRE_BUN_TESTS: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22' && '1' || '0' }}
