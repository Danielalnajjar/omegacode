name: Jev source publication and validation
on:
  push:
    branches: [codex/jev-execution-redesign]
    paths: [.github/jev-transfer.json]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact reviewed tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          meta = json.loads(pathlib.Path('.github/jev-transfer.json').read_text())
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          chunks = []
          for chunk in meta['chunks']:
              req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{chunk['sha']}", headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = base64.b64decode(json.load(response)['content'])
              assert len(data) == chunk['size']
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == chunk['sha']
              chunks.append(data)
          compressed = b''.join(chunks)
          assert hashlib.sha256(compressed).hexdigest() == meta['xzSha256']
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == meta['patchSha256']
          path = temp/'jev-source.patch'
          path.write_bytes(patch)
          subprocess.run(['git','rm','--ignore-unmatch','.github/workflows/jev-source-snapshot.yml','.github/workflows/jev-apply-changes.yml','.github/jev-transfer.json'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == meta['baseTree'], 'branch changed since preparation'
          subprocess.run(['git','apply','--index',str(path)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == meta['targetTree'], 'target does not match tested source'
          (temp/'jev-tree-receipt.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
          git diff --cached --check
          git config user.name 'Daniel Alnajjar'
          git config user.email '7518343+Danielalnajjar@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'feat(runtime): enable structured high-volume Jev execution' -m 'Incorporates #15 on current main. Intentional contract changes: structured Noul/Choice/Score definitions; 128 KiB serialized request guard and size-based batching instead of 32-question chunks; bounded connection/408/429/5xx retries. Preserve native permission, replay, cancellation, admission accounting and unknown usage. Pair with skills codex/jev-execution-redesign. Remove temporary source-transfer workflows. No live inference or deployment claim.'
          git push origin HEAD:refs/heads/codex/jev-execution-redesign
      - name: Install locked dependencies and validate full runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jev-validation"
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/jev-validation/install.log"
          pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/jev-validation/typecheck.log"
          pnpm build 2>&1 | tee "$RUNNER_TEMP/jev-validation/build.log"
          pnpm test 2>&1 | tee "$RUNNER_TEMP/jev-validation/tests.log"
      - name: Capture Node binary for matching local launcher tests
        if: always()
        shell: bash
        run: tar -czf "$RUNNER_TEMP/node24.tar.gz" -C "$(dirname "$(command -v node)")" node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-runtime-validation
          path: |
            ${{ runner.temp }}/jev-validation
            ${{ runner.temp }}/jev-tree-receipt.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-node24-test-runtime
          path: ${{ runner.temp }}/node24.tar.gz
          compression-level: 0
          retention-days: 1
