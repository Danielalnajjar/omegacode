name: Jev construction (temporary)
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/jev-evaluation-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$HEAD_SHA"
          git checkout -b "$HEAD_BRANCH" FETCH_HEAD
      - name: Apply Jev runtime implementation and verify
        env:
          PATCH_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/jev.patch
          git apply --check /tmp/jev.patch
          git apply /tmp/jev.patch
          rm -f .github/workflows/jev-construction.yml
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline
          pnpm typecheck
          pnpm test
          git diff --check
          test ! -e .github/workflows/jev-construction.yml
      - name: Publish tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Codex Connector'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'feat(runtime): add journaled TypeSafe evaluation primitive' -m 'Add evaluate() as a typed System One primitive separate from coding-agent providers. The host keeps TYPESAFE_API_KEY private, batches typed questions, retries only transient 429/529/transport failures, validates closed response shapes, accounts usage, and journals both success and failure for deterministic resume.' -m 'Runtime contract changes: add evaluate to the injected workflow globals and ambient types; add evaluation-specific deterministic keys and journal records; pass the host client through sandbox/runtime construction. Agent routing, provider/model semantics, and existing agent replay behavior are unchanged.' -m 'Validation: pnpm typecheck; pnpm test; git diff --check.'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:$HEAD_BRANCH"
