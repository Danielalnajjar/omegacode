name: Jev construction (temporary)
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/jev-evaluation-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact PR source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD
          git archive --format=zip HEAD -o /tmp/jev-source.zip
      - name: Return source workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jev-source
          path: /tmp/jev-source.zip
          retention-days: 1
