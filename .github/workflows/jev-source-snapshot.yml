name: Jev source snapshot
on:
  push:
    branches: [codex/jev-execution-redesign]
    paths: [.github/workflows/jev-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle committed source without checkout credentials
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/omegacode-source.bundle" refs/remotes/origin/main refs/remotes/origin/codex/jev-evaluation-recovery
          git bundle verify "$RUNNER_TEMP/omegacode-source.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: jev-omegacode-source
          path: ${{ runner.temp }}/omegacode-source.bundle
          retention-days: 1
          compression-level: 0
