name: Jev source snapshot
on:
  push:
    branches: [codex/jev-execution-redesign]
    paths: [.github/workflows/jev-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked build and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile
          tar -czf "$RUNNER_TEMP/omegacode-dependencies.tar.gz" node_modules viewer/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: jev-omegacode-dependencies
          path: ${{ runner.temp }}/omegacode-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
